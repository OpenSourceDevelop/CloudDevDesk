# OpenCode + code-server (VS Code) + GUI desktop (RustDesk) on CloudLab
# Base: ghcr.io/joostme/opencode-docker, extended with Qt libs and a RustDesk desktop sidecar
#
# Host folders (create beforehand, owner 1000:1000):
#   /opt/cloudlab/stacks/opencode/{repos,share,state,agents,config,ssh,build,desktop,desktop-config,x11,pulse}
#   x11/ additionally: chmod 1777
#
# Access:
#   http://<server>:4096  -> OpenCode Web  (basic auth)
#   http://<server>:8443  -> code-server   (password)
#   RustDesk ID from the "desktop" log -> GUI windows of the apps

name: opencode

services:
  # ---------------------------------------------------------------------------
  opencode:
    build:
      context: /opt/cloudlab/stacks/opencode/build
      args:
        BASE_TAG: ${OPENCODE_IMAGE_TAG:-latest}
    image: cloudlab/opencode-ide:local
    pull_policy: build
    container_name: opencode
    hostname: opencode
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      - desktop

    env_file: .env
    environment:
      TZ: Europe/Berlin
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      OPENCODE_PORT: "4096"
      CODE_SERVER_PORT: "8080"   # internal port – the mapping is under ports:
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD missing in .env}
      CODE_SERVER_PASSWORD: ${CODE_SERVER_PASSWORD:?CODE_SERVER_PASSWORD missing in .env}
      # GUI apps draw on the desktop sidecar
      DISPLAY: ":1"
      QT_QPA_PLATFORM: xcb
      # Sound goes to PulseAudio in the desktop sidecar
      PULSE_SERVER: unix:/tmp/pulse/native

    volumes:
      - /opt/cloudlab/stacks/opencode/repos:/repos
      - /opt/cloudlab/stacks/opencode/share:/home/opencode/.local/share
      - /opt/cloudlab/stacks/opencode/state:/home/opencode/.local/state   # OpenCode/mise state, owned by 1000
      - /opt/cloudlab/stacks/opencode/agents:/home/opencode/.agents
      - /opt/cloudlab/stacks/opencode/config:/home/opencode/.config
      - /opt/cloudlab/stacks/opencode/ssh:/home/opencode/.ssh-keys:ro
      - /opt/cloudlab/stacks/opencode/x11:/tmp/.X11-unix        # desktop X11 socket
      - /opt/cloudlab/stacks/opencode/pulse:/tmp/pulse          # desktop audio socket

    # Plain HTTP – passwords unencrypted. Replace with NPM + HTTPS later.
    ports:
      - "4096:4096"
      - "8443:8080"
    networks:
      - proxy-net
      - backend
      # - llm-net                # Stage 3: homelab Ollama via WireGuard

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
      - SYS_CHROOT
      - AUDIT_WRITE
    pids_limit: 4096
    mem_limit: ${MEM_LIMIT:-8g}
    cpus: ${CPU_LIMIT:-8}

    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS -o /dev/null http://127.0.0.1:8080/healthz && curl -s -o /dev/null http://127.0.0.1:4096
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  desktop:
    build:
      context: /opt/cloudlab/stacks/opencode/desktop
      args:
        RUSTDESK_VERSION: ${RUSTDESK_VERSION:-latest}
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    image: cloudlab/opencode-desktop:local
    pull_policy: build
    container_name: opencode-desktop
    hostname: opencode-desktop
    restart: unless-stopped

    environment:
      TZ: Europe/Berlin
      DISPLAY: ":1"
      RESOLUTION: ${DESKTOP_RESOLUTION:-1920x1080x24}
      # hbbs/hbbr run with network_mode: host -> reachable directly via the host.
      # The public name points to the host via extra_hosts (no detour via the floating IP).
      RUSTDESK_HBBS_HOST: ${RUSTDESK_SERVER:?RUSTDESK_SERVER missing in .env}
      RUSTDESK_HBBR_HOST: ${RUSTDESK_SERVER}
      RUSTDESK_KEY: ${RUSTDESK_KEY:?RUSTDESK_KEY missing in .env}
      RUSTDESK_PASSWORD: ${RUSTDESK_PASSWORD:?RUSTDESK_PASSWORD missing in .env}

    # Public name -> host (hbbs/hbbr listen there in the host network)
    extra_hosts:
      - "${RUSTDESK_SERVER}:host-gateway"

    volumes:
      - /opt/cloudlab/stacks/opencode/x11:/tmp/.X11-unix
      - /opt/cloudlab/stacks/opencode/pulse:/tmp/pulse
      - /opt/cloudlab/stacks/opencode/desktop-config:/home/desktop/.config/rustdesk   # keeps the ID stable

    # No ports: RustDesk connects outbound to hbbs/hbbr.
    networks:
      - backend

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: 256m
    mem_limit: 2g
    cpus: 2
    pids_limit: 512

    healthcheck:
      test: ["CMD", "xdpyinfo", "-display", ":1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  playwright-mcp:
    image: ${PLAYWRIGHT_MCP_IMAGE:-mcr.microsoft.com/playwright/mcp:latest}
    pull_policy: missing
    container_name: playwright-mcp
    restart: unless-stopped
    command:
      - --headless
      - --browser
      - chromium
      - --no-sandbox
      - --port
      - "8931"
      - --host
      - 0.0.0.0
      - --allowed-hosts
      - "*"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: 1g
    mem_limit: 2g
    cpus: 2
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy-net:
    external: true
  backend:
  # llm-net:                   # Stage 3
  #   external: true
